    <!-- Preconnect + load Google Fonts here (not via CSS @import — avoids render blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" />

    <!--
      Prevent flash of wrong theme — runs before the browser paints.
      First-visit default is always dark. If the visitor has previously
      selected a theme, that choice is restored from localStorage.
      Storage errors are caught silently so the page always loads.
    -->
    <script>
      try {
        var t = localStorage.getItem('portfolio-theme');
        document.documentElement.setAttribute('data-theme', (t === 'light' || t === 'dark') ? t : 'dark');
      } catch(e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
  </head>

    <!-- Skip to main content (accessibility) -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
